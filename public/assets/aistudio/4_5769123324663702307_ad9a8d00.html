.btn-p{background:var(--acc);color:#04201c;box-shadow:0 0 26px -6px var(--acc)}

.btn-g{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.13);color:#e6edf3}

.tx-acc{color:var(--acc)}
.bg-acc{background:var(--acc)}
.bd-acc{border-color:var(--acc)}

.chip.on{background:var(--acc);color:#04201c;border-color:var(--acc)}

@keyframes scan{0%{transform:translateY(40px)}100%{transform:translateY(330px)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.fade{animation:fadeUp .35s ease both}.pop{animation:pop .22s ease both}
.dotp{animation:pulseDot 1.8s ease-in-out infinite}
.scanline{animation:scan 2.4s ease-in-out infinite alternate}
.floaty{animation:floaty 4s ease-in-out infinite}

 const ex=84*sx, len=Math.abs(sh)*100+8, tw=type==='rimless'?1.5:type==='wayfarer'?6:3;
 return <g>
  <g transform={`scale(${sx} 1)`}>
   <g transform="translate(47,0)">{lensEl}</g>
   <g transform="translate(-47,0) scale(-1,1)">{lensEl}</g>
   {bridge}
  </g>
  <g stroke={frame} strokeWidth={tw} strokeLinecap="round" fill="none">
   <path d={`M${ex},-12 L${ex+(sh>=0?len:8)},-6`}/>
   <path d={`M${-ex},-12 L${-ex-(sh<0?len:8)},-6`}/>
  </g>
 </g>;
}

function Viewer3D({p,size='h-64'}){
 const [yaw,setYaw]=useState(25); const drag=useRef(null);
 return <div>
  <div className={'rounded-2xl grid-bg glass relative overflow-hidden touch-none select-none cursor-grab '+size}
   onPointerDown={e=>{drag.current=e.clientX;e.currentTarget.setPointerCapture(e.pointerId)}}
   onPointerMove={e=>{if(drag.current!==null){setYaw(y=>Math.max(-70,Math.min(70,y+(e.clientX-drag.current)*.6)));drag.current=e.clientX}}}
   onPointerUp={()=>drag.current=null}>

function Spin({p,w=120}){

 useEffect(()=>{const i=setInterval(()=>setT(x=>x+1),90);return()=>clearInterval(i)},[]);
 return <svg viewBox="-120 -50 240 100" width="100%" style={{maxWidth:w*2}}><Glasses type={p.type} frame={p.frame} lens={p.lens} yaw={Math.sin(t/9)*48}/></svg>;
}
function QR({size=150,seed='optiverse'}){
 const n=25; let h=0; for(const ch of seed) h=(h*31+ch.charCodeAt(0))>>>0;
 const rnd=()=>(h=(h*1664525+1013904223)>>>0)/4294967296;
 const fin=(x,y)=>(x<8&&y<8)||(x>n-9&&y<8)||(x<8&&y>n-9);
 const cells=[]; for(let y=0;y<n;y++)for(let x=0;x<n;x++){if(!fin(x,y)&&rnd()>.52)cells.push(<rect key={x+'-'+y} x={x} y={y} width="1" height="1"/>)}
 const F=({x,y})=><g><rect x={x} y={y} width="7" height="7"/><rect x={x+1} y={y+1} width="5" height="5" fill="#fff"/><rect x={x+2} y={y+2} width="3" height="3"/></g>;
 return <svg viewBox="-1 -1 27 27" width={size} height={size} style={{background:'#fff',borderRadius:12,padding:4}} fill="#0B1320">{cells}<F x={0} y={0}/><F x={n-7} y={0}/><F x={0} y={n-7}/></svg>;
}

 const [face,setFace]=useState('oval'); const [scanning,setScanning]=useState(false);

 const [img,setImg]=useState(null); const [notes,setNotes]=useState(''); const [pd,setPd]=useState(''); const [cname,setCname]=useState(''); const [cphone,setCphone]=useState('');
 const [fc,setFc]=useState(cur.frame); const [lc,setLc]=useState(cur.lens);
 useEffect(()=>{setFc(cur.frame);setLc(cur.lens)},[cur.id]);
 const lensV=lensTypes.filter(l=>l.on!==false).map(D), brandV=brands.filter(b=>b.on!==false).map(D), extrasV=extras.filter(e=>e.on!==false).map(D);
 const lensObj=lensV.find(l=>l.id===lt)||lensV[0]||{id:'_',name:'غير متاح',en:'',desc:'',price:0,icon:'eye'}; const brObj=brandV.find(b=>b.id===br)||brandV[0]||{id:'_',name:'—',en:'',price:0};
 const exV=ex.filter(id=>extrasV.some(e=>e.id===id));
 const extSum=exV.reduce((s,id)=>s+extrasV.find(e=>e.id===id).price,0);
 const lensP=lensObj.price+brObj.price+extSum; const total=cur.price+lensP;
 const match=faceMatch(cur,face);
 const recs=[...products].sort((a,b)=>faceMatch(b,face)-faceMatch(a,face)).slice(0,3);
 const list=products.filter(p=>cat==='all'||p.cat===cat);
 const flash=ms=>{setTrack(true);setTimeout(()=>setTrack(false),ms)};

 const cartTotal=cart.reduce((s,i)=>s+i.price,0);
 const mine=inq.filter(q=>q.mine);
 const onFile=e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>setImg(r.result);r.readAsDataURL(f)};
 const submitRx=()=>{
  if(!cname||!cphone){toast('اكتب اسمك ورقم موبايلك أولاً');return}
  const q={id:'#Q-'+(320+Math.floor(Math.random()*600)),kind:'rx',cust:cname,phone:cphone,frameName:cur.name,type:cur.type,frame:fc,lens:lc,lensName:lensObj.name,brandName:brObj.name,extrasTxt:exV.length?exV.map(id=>extrasV.find(e=>e.id===id).name).join('، '):'بدون إضافات',fp:cur.price,lensPrice:lensObj.price,add:brObj.price+extSum,price:total,img:img,notes:notes,pd:pd,status:'new',time:'الآن',mine:true,rxn:Math.floor(Math.random()*4)};
  setInq(a=>[q,...a]);setModal({t:'sent',q});setImg(null);setNotes('');setPd('');setStep(1);setEx([]);
 };
 const Heart=({p})=><button onClick={e=>{e.stopPropagation();setFav(f=>f.includes(p.id)?f.filter(x=>x!==p.id):[...f,p.id])}} className="w-9 h-9 rounded-full glass-s flex items-center justify-center" style={{color:fav.includes(p.id)?'#f43f5e':'#fff'}}><svg width="18" height="18" viewBox="0 0 24 24" fill={fav.includes(p.id)?'#f43f5e':'none'} stroke="currentColor" strokeWidth="2"><path d={P.heart}/></svg></button>;
 const nav=[['shop','المتجر','store'],['lens','العدسات','eye'],['fav','المفضلة','heart'],['ord','طلباتي','receipt'],['cart','السلة','bag']];
 const steps=['نوع العدسة','الشركة المصنعة','إضافات الحماية','الكشف والاستفسار'];
 return <div className="pt-14 pb-24 min-h-screen" style={{'--acc':shop.color}}>

   <div className="relative overflow-hidden rounded-3xl glass p-5 mb-5 text-center"><div className="absolute -top-16 left-1/2 -translate-x-1/2 w-72 h-32 rounded-full blur-3xl opacity-30 bg-acc"/><div className="relative"><span className="badge b-acc mb-2"><I n="spark" s={12}/> تجربة 3D من بيتك</span><h1 className="text-2xl sm:text-3xl font-extrabold gradtx leading-snug">اختار نظاراتك وأنت في البيت</h1><p className="text-xs sm:text-sm opacity-65 mt-1.5">جرّب على وشك بالكاميرا، شاركها مع صحابك، وابعت كشف نظرك للمحل</p></div></div>

   {tab==='shop'&&<div className="grid lg:grid-cols-2 gap-5 fade">

       :<>{split?<div className="grid grid-cols-2 h-full"><div className="border-e border-white/10 relative"><Face shape={face} type={cur.type} frame={cur.frame} lens={cur.lens} yaw={yaw} scan={scanning} tracking={track}/><span className="absolute bottom-1 inset-x-0 text-center text-[.7rem] opacity-80">{cur.name}</span></div><div className="relative"><Face shape={face} type={cmp.type} frame={cmp.frame} lens={cmp.lens} yaw={yaw} scan={scanning} tracking={track}/><span className="absolute bottom-1 inset-x-0 text-center text-[.7rem] opacity-80">{cmp.name}</span></div></div>

     {step===4&&<div className="space-y-3"><h3 className="font-extrabold">الخطوة 4: أرفق الكشف الطبي</h3>
      {!img?<div className="grid grid-cols-2 gap-2.5"><label className="rounded-2xl border-2 border-dashed border-white/20 hover:border-teal-400 p-5 text-center cursor-pointer block"><span className="tx-acc inline-block"><I n="upload" s={28}/></span><div className="text-sm font-bold mt-1">ارفع صورة الكشف</div><div className="text-xs opacity-55">من المعرض أو الكاميرا</div><input type="file" accept="image/*" className="hidden" onChange={onFile}/></label><button className="rounded-2xl border border-white/12 bg-white/5 hover:bg-white/10 p-5 text-center" onClick={()=>setImg('demo')}><span className="tx-acc inline-block"><I n="receipt" s={28}/></span><div className="text-sm font-bold mt-1">استخدم كشف تجريبي</div><div className="text-xs opacity-55">لتجربة الشاشة فقط</div></button></div>

      <input className="inp" dir="ltr" placeholder="مقاس PD (اختياري) مثال: 63" value={pd} onChange={e=>setPd(e.target.value)}/>
      <textarea className="inp" rows="3" placeholder="ملاحظات أو استفسار للمحل..." value={notes} onChange={e=>setNotes(e.target.value)}/>
      <div className="rounded-xl p-3 bg-amber-500/10 border border-amber-400/25 text-xs leading-6 text-amber-100">صاحب المحل هيراجع الكشف ويأكد لك الملاءمة والسعر النهائي قبل أي دفع — السعر الظاهر دلوقتي مبدئي.</div>

      <button className="btn btn-g w-full" onClick={()=>addCart({name:cur.name,desc:`${lensObj.name} · ${brObj.name}`,price:total,type:cur.type,frame:fc,lens:lc})}><I n="bag" s={16}/> أو أضف للسلة بدون كشف</button></div>}
     </div>
     <div className="flex justify-between mt-4"><button className="btn btn-g" disabled={step===1} style={{opacity:step===1?.35:1}} onClick={()=>setStep(s=>Math.max(1,s-1))}>السابق</button>{step<4&&<button className="btn btn-p" onClick={()=>setStep(s=>s+1)}>التالي</button>}</div>
    </div></div>}

   {tab==='fav'&&<div className="fade"><h2 className="font-extrabold text-xl mb-4">المفضلة ({fav.length})</h2>
    {!fav.length?<Empty icon="heart" t="لا توجد مفضلات بعد" s="اضغط على القلب في أي نظارة لإضافتها" b="تصفح المتجر" on={()=>setTab('shop')}/>:<div className="grid grid-cols-2 md:grid-cols-3 gap-3">{products.filter(p=>fav.includes(p.id)).map(p=><div key={p.id} className="glass rounded-2xl p-3"><div className="relative grid-bg rounded-xl py-3 flex justify-center"><MiniGlasses type={p.type} frame={p.frame} lens={p.lens} w={120}/><span className="absolute top-1.5 end-1.5"><Heart p={p}/></span></div><div className="font-bold text-sm mt-2">{p.name}</div><div className="tx-acc font-extrabold text-sm mb-2"><Egp v={p.price}/></div><button className="btn btn-p btn-sm w-full" onClick={()=>{setCur(p);setTab('shop');toast('جرّبتها على وجهك ✓')}}>جرّب الآن</button></div>)}</div>}</div>}

   {tab==='ord'&&<div className="fade max-w-2xl mx-auto"><h2 className="font-extrabold text-xl mb-4">طلباتي واستفساراتي</h2>

     <div className={'mt-3 text-xs rounded-lg p-2.5 '+(q.status==='confirmed'?'bg-emerald-500/10 text-emerald-200':q.status==='alt'?'bg-amber-500/10 text-amber-200':'bg-sky-500/10 text-sky-200')}>{q.status==='new'?'بانتظار مراجعة المحل للكشف وتأكيد الملاءمة.':q.status==='confirmed'?'المحل أكد الملاءمة ✅ — أكمل الاتفاق على واتساب.':`المحل اقترح عدسة بديلة: ${q.alt} — السعر المحدّث ${fmt(q.price)} ج.م.`}</div>{q.status==='confirmed'&&<Stages s={q.stage}/>}</div>)}</div>}</div>}

   {tab==='cart'&&<div className="fade max-w-2xl mx-auto"><h2 className="font-extrabold text-xl mb-4">السلة ({cart.length})</h2>
    {!cart.length?<Empty icon="bag" t="سلتك فارغة" s="أضف نظارة من المتجر أو من قسم العدسات" b="تصفح المتجر" on={()=>setTab('shop')}/>:<>
     <div className="space-y-3 mb-4">{cart.map(i=><div key={i.key} className="glass rounded-2xl p-3 flex items-center gap-3"><div className="grid-bg rounded-xl p-2"><MiniGlasses type={i.type} frame={i.frame} lens={i.lens} w={84}/></div><div className="flex-1"><div className="font-bold text-sm">{i.name}</div><div className="text-xs opacity-60">{i.desc}</div><div className="tx-acc font-extrabold text-sm"><Egp v={i.price}/></div></div><button className="btn btn-d btn-sm" onClick={()=>setCart(c=>c.filter(x=>x.key!==i.key))}><I n="trash" s={14}/></button></div>)}</div>
     <div className="glass rounded-2xl p-4"><div className="flex justify-between font-extrabold text-xl mb-3"><span>الإجمالي</span><span className="tx-acc"><Egp v={cartTotal}/></span></div><button className="btn btn-p w-full !py-3 !text-base" onClick={()=>setModal({t:'checkout',total:cartTotal})}><I n="msg" s={18}/> إتمام الطلب عبر واتساب</button></div></>}</div>}
  </div>

  <nav className="fixed bottom-0 inset-x-0 z-40 glass-s border-x-0 border-b-0"><div className="max-w-xl mx-auto grid grid-cols-5 px-2 py-1.5">
   {nav.map(n=><button key={n[0]} onClick={()=>setTab(n[0])} className={'relative flex flex-col items-center gap-0.5 py-1.5 rounded-xl text-[.68rem] font-bold transition '+(tab===n[0]?'tx-acc':'opacity-60')}>
    <span className="relative"><I n={n[2]} s={22}/>{n[0]==='fav'&&fav.length>0&&<span className="absolute -top-1.5 -end-2 min-w-[16px] h-4 px-1 rounded-full bg-rose-500 text-white text-[.6rem] flex items-center justify-center">{fav.length}</span>}{n[0]==='cart'&&cart.length>0&&<span className="absolute -top-1.5 -end-2 min-w-[16px] h-4 px-1 rounded-full bg-acc text-[#04201c] text-[.6rem] flex items-center justify-center">{cart.length}</span>}</span>{n[1]}
    {tab===n[0]&&<span className="absolute -bottom-0.5 w-6 h-0.5 rounded-full bg-acc"/>}</button>)}</div></nav>
 </div>;
}
function Empty({icon,t,s,b,on}){return <div className="glass rounded-3xl p-10 text-center"><span className="w-16 h-16 rounded-full b-acc inline-flex items-center justify-center mb-3"><I n={icon} s={30}/></span><div className="font-extrabold text-lg">{t}</div><p className="text-sm opacity-60 mb-4">{s}</p><button className="btn btn-p" onClick={on}>{b}</button></div>;}

/* ================= MODALS ================= */
function Modals(){
 const {modal,setModal,toast,go,setShops,setExtra,setProducts,shop,cart,setCart,setInq,setLensTypes,setBrands,setExtras,products}=useContext(Ctx);
 const [f,setF]=useState({}); const [done,setDone]=useState(null);
 useEffect(()=>{setF({});setDone(null)},[modal]);
 if(!modal)return null;
 const t=typeof modal==='string'?modal:modal.t; const close=()=>setModal(null);
 const set=k=>e=>setF({...f,[k]:e.target.value});
 if(t==='login')return <Modal title="تسجيل الدخول" onClose={close}><div className="space-y-3"><input className="inp" placeholder="البريد الإلكتروني أو رقم الموبايل"/><input className="inp" type="password" placeholder="كلمة المرور"/><button className="btn btn-p w-full" onClick={()=>{close();go('merchant');toast('أهلاً بعودتك 👋')}}>دخول كتاجر</button><button className="btn btn-g w-full" onClick={()=>{close();go('admin');toast('تم الدخول كمدير للمنصة')}}>دخول كمدير المنصة</button></div></Modal>;
 if(t==='signup')return <Modal title="أنشئ متجرك مجاناً" onClose={close}><div className="space-y-3"><input className="inp" placeholder="اسم المحل" value={f.n||''} onChange={set('n')}/><input className="inp" placeholder="رقم واتساب" dir="ltr" value={f.p||''} onChange={set('p')}/><input className="inp" placeholder="المدينة" value={f.c||''} onChange={set('c')}/><button className="btn btn-p w-full !py-3" onClick={()=>{close();go('merchant');toast('تم إنشاء متجرك 🎉 ابدأ برفع نظاراتك')}}>ابدأ الآن</button><p className="text-xs opacity-50 text-center">تجربة مجانية 14 يوماً — بدون بطاقة</p></div></Modal>;
 if(t==='addshop')return <Modal title="إضافة محل يدوياً" onClose={close}><div className="space-y-3"><input className="inp" placeholder="اسم المحل" value={f.n||''} onChange={set('n')}/><input className="inp" placeholder="المدينة" value={f.c||''} onChange={set('c')}/><select className="inp" value={f.p||'أساسية'} onChange={set('p')}><option>أساسية</option><option>احترافية</option></select><button className="btn btn-p w-full" onClick={()=>{if(!f.n){toast('اكتب اسم المحل أولاً');return}const pro=f.p==='احترافية';setShops(a=>[{id:Date.now(),name:f.n,city:f.c||'القاهرة',plan:f.p||'أساسية',days:30,status:'active',exp:'21 ديسمبر',slug:'new-shop',price:pro?1200:600},...a]);setExtra(x=>x+1);close();toast(`تمت إضافة ${f.n} ✓`)}}>إضافة المحل</button></div></Modal>;
 if(t==='renew'){const s=modal.s;return <Modal title={`تجديد اشتراك ${s.name}`} onClose={close}><div className="space-y-2 mb-4">{[[1,0],[3,10],[12,20]].map(m=><button key={m[0]} onClick={()=>setF({m:m[0]})} className={'w-full flex justify-between p-3 rounded-xl border '+((f.m||1)===m[0]?'bd-acc bg-white/10':'border-white/10 bg-white/5')}><span>{m[0]===1?'شهر':m[0]===3?'3 أشهر':'سنة'}{m[1]?<span className="badge b-ok ms-2">خصم {m[1]}%</span>:null}</span><b className="tx-acc"><Egp v={Math.round(s.price*m[0]*(1-m[1]/100))}/></b></button>)}</div><button className="btn btn-p w-full" onClick={()=>{const m=f.m||1;setShops(a=>a.map(x=>x.id===s.id?{...x,days:x.days+30*m,status:'active',exp:'تم التجديد'}:x));close();toast(`تم تجديد ${s.name} ✓`)}}>تأكيد التجديد</button></Modal>;}
 if(t==='addprod')return <Modal title="إضافة نظارة جديدة" onClose={close}><div className="space-y-3"><div className="rounded-2xl border-2 border-dashed border-white/20 p-6 text-center cursor-pointer hover:border-teal-400" onClick={()=>toast('رفع الصور/GLB متاح في النسخة الحقيقية')}><span className="tx-acc inline-block"><I n="upload" s={28}/></span><div className="text-sm font-bold mt-1">ارفع صورة أو ملف GLB</div><div className="text-xs opacity-60">سيتحول تلقائياً إلى موديل 3D</div></div>
  <input className="inp" placeholder="اسم النظارة" value={f.n||''} onChange={set('n')}/><div className="grid grid-cols-2 gap-2"><select className="inp" value={f.t||'aviator'} onChange={set('t')}>{Object.entries(TYPES).map(x=><option key={x[0]} value={x[0]}>{x[1]}</option>)}</select><select className="inp" value={f.k||'sun'} onChange={set('k')}>{Object.entries(CATS).map(x=><option key={x[0]} value={x[0]}>{x[1]}</option>)}</select></div><input className="inp" type="number" placeholder="السعر (ج.م)" value={f.pr||''} onChange={set('pr')}/><input className="inp font-mono" dir="ltr" placeholder="كود النظارة (اختياري — بيتولّد تلقائياً)" value={f.cd||''} onChange={set('cd')}/>
  <div className="flex gap-2">{FRAME_COLORS.map(c=><button key={c[1]} onClick={()=>setF({...f,c:c[1]})} className="w-8 h-8 rounded-full border-2" style={{background:c[1],borderColor:(f.c||'#C9A24B')===c[1]?'#fff':'transparent'}}/>)}</div>
  <button className="btn btn-p w-full" onClick={()=>{if(!f.n){toast('اكتب اسم النظارة');return}const nums=products.map(x=>parseInt(String(x.code||'').replace(/\D/g,''),10)||0);const code=(f.cd||'').trim().toUpperCase()||('FR-'+(Math.max(1000,...nums)+1));if(products.some(x=>(x.code||'').toUpperCase()===code)){toast('الكود ده مستخدم لنظارة تانية');return}setProducts(a=>[...a,{id:Date.now(),code,name:f.n,type:f.t||'aviator',cat:f.k||'sun',price:+f.pr||700,frame:f.c||'#C9A24B',lens:'#475569',shapes:['oval','round']}]);close();toast('تمت إضافة النظارة وتحويلها إلى 3D ✓')}}>إضافة</button></div></Modal>;
 if(t==='view3d'){const p=modal.p;return <Modal title={p.name} onClose={close}><Viewer3D p={p}/><div className="flex justify-between items-center mt-3"><span className="text-sm opacity-70">{TYPES[p.type]} · {CATS[p.cat]}</span><b className="tx-acc"><Egp v={p.price}/></b></div></Modal>;}
 if(t==='share'){const msg=encodeURIComponent('تفضل رابط متجرنا: https://'+modal.link);return <Modal title="مشاركة الرابط" onClose={close}><div className="p-3 rounded-xl bg-white/5 font-mono text-sm mb-3 truncate" dir="ltr">{modal.link}</div><div className="grid grid-cols-2 gap-2"><button className="btn btn-g" onClick={()=>{try{navigator.clipboard.writeText('https://'+modal.link).then(()=>toast('تم نسخ الرابط ✓')).catch(()=>toast('انسخ الرابط يدوياً'))}catch(e){toast('انسخ الرابط يدوياً')}}}><I n="copy" s={15}/> نسخ الرابط</button><a className="btn btn-p" href={`https://wa.me/?text=${msg}`} target="_blank" rel="noreferrer"><I n="msg" s={15}/> واتساب</a></div></Modal>;}
 if(t==='vote')return <VoteModal p={modal.p} link={modal.link} onClose={close} toast={toast}/>;
 if(t==='catitem'){const k=modal.kind,it=modal.item;
  const setter=k==='lens'?setLensTypes:k==='brand'?setBrands:setExtras;
  const val=(key,d)=>f[key]!==undefined?f[key]:(d==null?'':String(d));
  const nm=val('n',it&&it.name), en=val('e',it&&it.en), pr=val('p',it&&it.price);
  const noun={lens:'نوع عدسة',brand:'شركة',extra:'ميزة حماية'}[k];
  const priceLbl={lens:'السعر الأساسي (ج.م)',brand:'فرق السعر الإضافي (ج.م)',extra:'السعر (ج.م)'}[k];
  const save=()=>{const name=nm.trim();const price=parseInt(pr,10);
   if(!name){toast('اكتب الاسم بالعربي أولاً');return}
   if(isNaN(price)||price<0){toast('اكتب سعراً صحيحاً (0 أو أكثر)');return}
   const extra=k!=='extra'?{en:en.trim()}:{};
   if(it){setter(a=>a.map(x=>x.id===it.id?{...x,name,...extra,price}:x));toast(`تم حفظ التعديلات على "${name}" — ظهرت في متجر العميل فوراً ✓`)}
   else{setter(a=>[...a,{id:k+'_'+Date.now(),name,...extra,price,on:true,...(k==='lens'?{desc:'',icon:'eye'}:{})}]);toast(`تمت إضافة "${name}" — تظهر الآن في متجر العميل ✓`)}
   close()};
  return <Modal title={it?`تعديل ${noun}`:`إضافة ${noun}`} onClose={close}><div className="space-y-3">
   <div><label className="text-xs opacity-60">الاسم بالعربي</label><input className="inp mt-1" value={nm} onChange={set('n')} placeholder={k==='lens'?'مثال: فوتوكروميك':k==='brand'?'مثال: ياباني':'مثال: طبقة أوليوفوبيك'}/></div>
   {k!=='extra'&&<div><label className="text-xs opacity-60">الاسم بالإنجليزي (اختياري)</label><input className="inp mt-1" dir="ltr" value={en} onChange={set('e')} placeholder={k==='lens'?'Photochromic':'Japanese'}/></div>}
   <div><label className="text-xs opacity-60">{priceLbl}</label><input className="inp mt-1" type="number" inputMode="numeric" min="0" value={pr} onChange={set('p')} placeholder="0"/></div>
   <button className="btn btn-p w-full !py-3" onClick={save}><I n="check" s={17}/> {it?'حفظ التعديلات':'إضافة'}</button></div></Modal>;}
 if(t==='catdel'){const k=modal.kind,it=modal.item;const setter=k==='lens'?setLensTypes:k==='brand'?setBrands:setExtras;
  return <Modal title="تأكيد الحذف" onClose={close}><p className="text-sm opacity-80 mb-4">هتحذف <b>"{it.name}"</b> نهائياً وهيختفي من متجر العميل. لو عايز تخفيه مؤقتاً استخدم زر التفعيل/الإخفاء بدل الحذف.</p>
   <div className="grid grid-cols-2 gap-2"><button className="btn btn-g" onClick={close}>إلغاء</button><button className="btn btn-d" onClick={()=>{setter(a=>a.filter(x=>x.id!==it.id));close();toast(`تم حذف "${it.name}" ✓`)}}><I n="trash" s={14}/> حذف</button></div></Modal>;}
 if(t==='disc'){const k=modal.kind,it=modal.item;const setter=k==='lens'?setLensTypes:k==='brand'?setBrands:k==='extra'?setExtras:setProducts;
  const d=f.d!==undefined?f.d:String(it.disc||'');const dv=parseInt(d,10)||0;
  const save=()=>{const v=d===''?0:parseInt(d,10);if(isNaN(v)||v<0||v>90){toast('اكتب نسبة خصم من 0 إلى 90');return}setter(a=>a.map(x=>x.id===it.id?{...x,disc:v}:x));close();toast(v?`تم تطبيق خصم ${v}% على "${it.name}" — ظاهر للعملاء الآن ✓`:`تم إلغاء الخصم عن "${it.name}" ✓`)};
  return <Modal title={`خصم على ${it.name}`} onClose={close}><div className="space-y-3">
   <div className="flex gap-2 flex-wrap">{[5,10,15,20,25,30].map(n=><button key={n} className={'chip '+(dv===n?'on':'')} onClick={()=>setF({...f,d:String(n)})}>{n}%</button>)}</div>
   <div><label className="text-xs opacity-60">نسبة الخصم % (0 = بدون خصم)</label><input className="inp mt-1" type="number" inputMode="numeric" min="0" max="90" value={d} onChange={set('d')} placeholder="0"/></div>
   <div className="rounded-xl bg-white/5 p-3 text-sm flex justify-between"><span>السعر بعد الخصم</span><b className="tx-acc"><Egp v={Math.round(it.price*(1-dv/100))}/></b></div>
   <button className="btn btn-p w-full !py-3" onClick={save}><I n="check" s={17}/> حفظ الخصم</button></div></Modal>;}
 if(t==='ba')return <Modal title="شاهد الفرق بعينك" onClose={close}><BeforeAfter lens={modal.lens}/></Modal>;
 if(t==='zoom')return <ZoomModal q={modal.q} onClose={close}/>;
 if(t==='confirmq')return <ConfirmModal q={modal.q} onClose={close}/>;
 if(t==='altq')return <AltModal q={modal.q} onClose={close}/>;
 if(t==='sent'){const q=modal.q;const msg=encodeURIComponent(`مرحباً ${shop.name}، أنا ${q.cust}.\nاخترت ${q.frameName} مع ${q.lensName} (${q.brandName}) — الإضافات: ${q.extrasTxt}.\nالسعر المبدئي: ${fmt(q.price)} ج.م${q.pd?'\nPD: '+q.pd:''}${q.notes?'\nملاحظات: '+q.notes:''}\nرقم الاستفسار ${q.id} — برجاء مراجعة الكشف وتأكيد الملاءمة والسعر النهائي.`);
  return <Modal title="تم إرسال استفسارك 🎉" onClose={close}><div className="text-center"><span className="w-16 h-16 rounded-full b-ok inline-flex items-center justify-center mb-3"><I n="check" s={32}/></span><div className="font-extrabold text-lg mb-1">رقم الاستفسار {q.id}</div><p className="text-sm opacity-70 mb-4 leading-7">وصل الكشف لصندوق المحل. كمّل على واتساب (وابعت صورة الكشف في المحادثة) وهيأكد لك الملاءمة والسعر النهائي.</p><a className="btn btn-p w-full !py-3" href={`https://wa.me/${waNum(shop.wa)}?text=${msg}`} target="_blank" rel="noreferrer"><I n="msg" s={18}/> فتح واتساب المحل</a><button className="btn btn-g w-full mt-2" onClick={close}>تم</button></div></Modal>;}
 if(t==='checkout'){
  const submit=()=>{if(!f.n||!f.p){toast('اكتب الاسم ورقم الموبايل');return}
   const q={id:'#O-'+(400+Math.floor(Math.random()*500)),kind:'order',cust:f.n,phone:f.p,frameName:cart.map(i=>i.name).join(' + '),type:cart[0]?cart[0].type:'aviator',frame:cart[0]?cart[0].frame:'#C9A24B',lens:cart[0]?cart[0].lens:'#475569',lensName:'طلب مباشر',brandName:'—',extrasTxt:'—',fp:modal.total,lensPrice:0,add:0,price:modal.total,img:null,notes:'الدفع عبر '+(f.pay||'InstaPay'),pd:'',status:'new',time:'الآن',mine:true,rxn:0,pay:f.pay||'InstaPay'};
   setInq(a=>[q,...a]);setDone(q);setCart([]);};
  if(done){const msg=encodeURIComponent(`مرحباً ${shop.name}، أنا ${done.cust}، طلبت (${done.frameName}) بإجمالي ${fmt(done.price)} ج.م — رقم الطلب ${done.id}. الدفع عبر ${done.pay}.`);return <Modal title="تم تسجيل طلبك 🎉" onClose={close}><div className="text-center"><span className="w-16 h-16 rounded-full b-ok inline-flex items-center justify-center mb-3"><I n="check" s={32}/></span><div className="font-extrabold text-lg mb-1">رقم الطلب {done.id}</div><p className="text-sm opacity-70 mb-4">أكمل الآن مع المحل على واتساب لتأكيد الدفع</p><a className="btn btn-p w-full !py-3" href={`https://wa.me/${waNum(shop.wa)}?text=${msg}`} target="_blank" rel="noreferrer"><I n="msg" s={18}/> فتح واتساب المحل</a><button className="btn btn-g w-full mt-2" onClick={close}>تم</button></div></Modal>;}
  return <Modal title="إتمام الطلب" onClose={close}><div className="space-y-3"><input className="inp" placeholder="اسمك" value={f.n||''} onChange={set('n')}/><input className="inp" dir="ltr" placeholder="رقم الموبايل" value={f.p||''} onChange={set('p')}/><div className="text-xs opacity-60">طريقة الدفع</div><div className="grid grid-cols-2 gap-2">{['InstaPay','Vodafone Cash'].map(p=><button key={p} onClick={()=>setF({...f,pay:p})} className={'p-3 rounded-xl border font-bold text-sm '+((f.pay||'InstaPay')===p?'bd-acc bg-white/10':'border-white/10 bg-white/5')}>{p}</button>)}</div><div className="flex justify-between font-extrabold pt-2 border-t border-white/10"><span>الإجمالي</span><span className="tx-acc"><Egp v={modal.total}/></span></div><button className="btn btn-p w-full !py-3" onClick={submit}><I n="msg" s={17}/> إرسال الطلب عبر واتساب</button></div></Modal>;
 }
 return null;
}

/* ================= APP ================= */
function App(){
 const [view,setView]=useState('landing');
 const [modal,setModal]=useState(null);
 const [tst,setTst]=useState(null);
 const [shop,setShop]=useState({name:'دهب للبصريات',slug:'dahab-optics',color:'#14B8A6',wa:'01001234567',logo:'👓'});
 const [shops,setShops]=useState(SHOPS0); const [extraShops,setExtra]=useState(0);
 const [products,setProducts]=useState(PRODUCTS0); const [inq,setInq]=useState(INQ0);
 const [lensTypes,setLensTypes]=useState(LENS_TYPES0); const [brands,setBrands]=useState(BRANDS0); const [extras,setExtras]=useState(EXTRAS0);
 const [fav,setFav]=useState([1]); const [cart,setCart]=useState([]);
 const [plans,setPlans]=useState([{id:1,name:'الباقة الأساسية',price:600,on:true,feats:['حتى 50 نظارة 3D','رابط متجر + QR','استقبال الكشوفات']},{id:2,name:'الباقة الاحترافية',price:1200,on:true,feats:['نظارات غير محدودة','ترشيح الذكاء الاصطناعي ورادار التحليلات','Split View وتقارير متقدمة']}]);
 const toast=m=>{setTst(m);clearTimeout(window.__t);window.__t=setTimeout(()=>setTst(null),2400)};
 const go=v=>{setView(v);window.scrollTo(0,0)};
 const enterShop=s=>{setShop(x=>({...x,name:s.name,slug:s.slug}));go('merchant');toast(`دخلت كمتجر: ${s.name}`)};
 const tabs=[['landing','الصفحة الرئيسية','home'],['admin','الإدارة العليا','crown'],['merchant','لوحة التاجر','store'],['store','متجر العميل','phone']];
 const newCount=inq.filter(q=>q.status==='new').length;
 return <Ctx.Provider value={{go,toast,modal,setModal,shop,setShop,shops,setShops,extraShops,setExtra,products,setProducts,inq,setInq,lensTypes,setLensTypes,brands,setBrands,extras,setExtras,fav,setFav,cart,setCart,plans,setPlans,enterShop}}>
  <nav className="fixed top-0 inset-x-0 z-50 h-14 glass-s border-x-0 border-t-0"><div className="h-full max-w-7xl mx-auto px-3 flex items-center gap-3">
   <div className="hidden sm:flex items-center gap-2 font-extrabold"><span className="w-7 h-7 rounded-lg bg-acc text-[#04201c] flex items-center justify-center"><I n="glasses" s={16}/></span>OptiVerse</div>
   <div className="flex-1 flex gap-1.5 overflow-x-auto noscroll justify-start sm:justify-center">{tabs.map(t=><button key={t[0]} onClick={()=>go(t[0])} className={'btn btn-sm !rounded-xl relative '+(view===t[0]?'btn-p':'btn-g')}><I n={t[2]} s={15}/><span className="text-[.78rem]">{t[1]}</span>{t[0]==='merchant'&&newCount>0&&<span className="min-w-[16px] h-4 px-1 rounded-full bg-rose-500 text-white text-[.62rem] flex items-center justify-center">{newCount}</span>}</button>)}</div>
   <span className="hidden md:inline badge b-warn">نموذج تجريبي</span></div></nav>
  {view==='landing'&&<Landing/>}{view==='admin'&&<Admin/>}{view==='merchant'&&<Merchant/>}{view==='store'&&<Store/>}
  <Modals/>
  {tst&&<div className="fixed z-[120] bottom-24 inset-x-0 flex justify-center pointer-events-none"><div className="pop glass-s px-5 py-3 rounded-2xl font-bold text-sm shadow-2xl border-teal-400/40 flex items-center gap-2"><span className="tx-acc"><I n="check" s={16}/></span>{tst}</div></div>}
 </Ctx.Provider>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
